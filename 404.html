<!DOCTYPE html>
<html lang="en" dir="ltr" id="html-tag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://placehold.co/40x40/8b5cf6/ffffff?text=N">

    <title>404 | Nexus Esports</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#8b5cf6',
                    },
                    animation: {
                        'glitch': 'glitch 1s linear infinite',
                    },
                    keyframes: {
                        glitch: {
                            '2%, 64%': { transform: 'translate(2px,0) skew(0deg)' },
                            '4%, 60%': { transform: 'translate(-2px,0) skew(0deg)' },
                            '62%': { transform: 'translate(0,0) skew(5deg)' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        .glitch-text { text-shadow: 2px 0 #ff00c1, -2px 0 #00fff9; }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white transition-colors duration-300 min-h-screen flex flex-col" 
      x-data="uiControls()" 
      x-init="initTheme(); initDir();">

    <header class="p-6 flex justify-between items-center w-full max-w-7xl mx-auto">
        <a href="index.html" class="flex items-center gap-3 group">
            <div class="bg-primary p-2 rounded-lg shadow-lg shadow-primary/30 group-hover:scale-110 transition-transform">
                <img src="https://placehold.co/40x40/8b5cf6/ffffff?text=N" alt="Nexus Logo" class="h-6 w-6">
            </div>
            <span class="text-xl lg:text-2xl font-semibold  tracking-tighter text-primary">NEXUS</span>
        </a>

        <div class="flex items-center gap-3">
            <button @click="toggleDir()" 
                    class="text-[10px] font-black px-3 py-1.5 border border-slate-300 dark:border-slate-700 rounded-lg hover:bg-white dark:hover:bg-slate-800 transition-all uppercase"
                    x-text="dir === 'ltr' ? 'LTR' : 'RTL'">
            </button>
            <button @click="toggleDark()" 
                    class="p-2.5 bg-white dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-lg hover:shadow-md transition-all">
                <i x-show="!darkMode" class="fa-solid fa-moon text-slate-600"></i>
                <i x-show="darkMode" class="fa-solid fa-sun text-yellow-400"></i>
            </button>
        </div>
    </header>

    <main class="flex-grow flex items-center justify-center px-6 py-12 text-center">
        <div class="max-w-2xl w-full">
            <div class="relative inline-block mb-8">
                <h1 class="text-[120px] md:text-[180px] font-black italic leading-none tracking-tighter animate-glitch glitch-text opacity-20 dark:opacity-40">404</h1>
                <div class="absolute inset-0 flex items-center justify-center">
                    <span class="text-4xl md:text-6xl font-black uppercase italic tracking-widest text-primary drop-shadow-[0_0_15px_rgba(139,92,246,0.5)]">
                        Out of Bounds
                    </span>
                </div>
            </div>

            <div class="space-y-6">
                <h2 class="text-2xl md:text-3xl font-black uppercase italic">Map Not Found</h2>
                <p class="text-slate-500 dark:text-slate-400 max-w-md mx-auto leading-relaxed">
                    It looks like you've wandered outside the playable area. This page doesn't exist or has been relocated to a different server.
                </p>
                
                <div class="flex flex-col sm:flex-row items-center justify-center gap-4 pt-8">
                    <a href="index.html" class="w-full sm:w-auto px-8 py-4 bg-primary hover:bg-violet-600 text-white font-black uppercase italic tracking-widest rounded-xl shadow-lg shadow-primary/30 transform active:scale-95 transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-house"></i> Return to Base
                    </a>
                    <a href="contact.html" class="w-full sm:w-auto px-8 py-4 bg-transparent border-2 border-slate-300 dark:border-slate-700 hover:border-primary text-slate-600 dark:text-slate-300 font-black uppercase italic tracking-widest rounded-xl transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-headset"></i> Report Issue
                    </a>
                </div>
            </div>
        </div>
    </main>

    <footer class="p-8 text-center text-[10px] font-black uppercase tracking-[0.5em] text-slate-300 dark:text-slate-800">
        Error Code: ERR_LEVEL_NOT_LOADED_NEXUS
    </footer>

    <script>
        function uiControls() {
            return {
                darkMode: false,
                dir: 'ltr',
                initTheme() {
                    if (localStorage.getItem('dark-mode') === 'true' || (!('dark-mode' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                        this.darkMode = true;
                        document.documentElement.classList.add('dark');
                    }
                },
                toggleDark() {
                    this.darkMode = !this.darkMode;
                    localStorage.setItem('dark-mode', this.darkMode);
                    this.darkMode ? document.documentElement.classList.add('dark') : document.documentElement.classList.remove('dark');
                },
                initDir() {
                    this.dir = localStorage.getItem('site-dir') || 'ltr';
                    document.getElementById('html-tag').dir = this.dir;
                },
                toggleDir() {
                    this.dir = this.dir === 'ltr' ? 'rtl' : 'ltr';
                    localStorage.setItem('site-dir', this.dir);
                    document.getElementById('html-tag').dir = this.dir;
                }
            }
        }
    </script>
</body>
</html>
