<!DOCTYPE html>
<html lang="en" dir="ltr" id="html-tag">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="https://placehold.co/40x40/8b5cf6/ffffff?text=N">

    <title>Nexus Esports | Sign Up</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: '#8b5cf6',
                    }
                }
            }
        }
    </script>
    <style>
        [x-cloak] { display: none !important; }
        input:checked + div { border-color: #8b5cf6; background-color: rgba(139, 92, 246, 0.1); }
    </style>
</head>
<body class="bg-slate-50 dark:bg-slate-950 text-slate-900 dark:text-white transition-colors duration-300 min-h-screen flex flex-col" 
      x-data="authPage()" 
      x-init="initTheme(); initDir();">

    <header class="p-6 flex justify-between items-center w-full max-w-7xl mx-auto">
        <a href="index.html" class="flex items-center gap-3 group">
            <div class="bg-primary p-2 rounded-lg shadow-lg shadow-primary/30 group-hover:scale-110 transition-transform">
            <img src="https://placehold.co/40x40/8b5cf6/ffffff?text=N" alt="Nexus Logo" class="h-8 w-auto lg:h-10 rounded-lg shadow-lg shadow-primary/20">
            </div>
            <span class="text-xl lg:text-2xl font-semibold  tracking-tighter text-primary">NEXUS</span>
        </a>

                  <div class="flex items-center gap-2">
    <button @click="toggleDark()" 
            class="w-10 h-10 flex items-center justify-center rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-primary transition-all active:scale-95 group shadow-sm">
        <i x-show="!darkMode" class="fa-solid fa-moon text-slate-500 group-hover:text-primary"></i>
        <i x-show="darkMode" class="fa-solid fa-sun text-yellow-400"></i>
    </button>

    <button @click="toggleDir()" 
            class="w-10 h-10 flex items-center justify-center rounded-xl bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 hover:border-primary transition-all active:scale-95 shadow-sm"
            style="font-style: normal !important;">
        <span class="text-[10px] font-black uppercase tracking-tighter text-slate-500 dark:text-slate-400" 
              x-text="dir === 'ltr' ? 'LTR' : 'RTL'"></span>
    </button>
</div>
    </header>

    <main class="flex-grow flex items-center justify-center px-4 py-8">
        <div class="w-full max-w-lg bg-white dark:bg-slate-900 rounded-3xl border border-slate-200 dark:border-slate-800 p-8 shadow-2xl shadow-slate-200/50 dark:shadow-black/50">
            
            <div class="text-center mb-8">
                <h1 class="text-3xl font-semibold uppercase italic tracking-tight">Create <span class="text-primary">Account</span></h1>
                <p class="text-sm text-slate-500 dark:text-slate-400 mt-2">Join the elite community and start your pro journey.</p>
            </div>

            <form action="#" class="space-y-5">
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-black uppercase tracking-widest text-slate-400 mb-2">First Name</label>
                        <input type="text" placeholder="Srinivas" 
                               class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all">
                    </div>
                    <div>
                        <label class="block text-xs font-black uppercase tracking-widest text-slate-400 mb-2">Last Name</label>
                        <input type="text" placeholder="K A" 
                               class="w-full px-4 py-3 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-black uppercase tracking-widest text-slate-400 mb-2">Email Address</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400"><i class="fa-solid fa-envelope"></i></span>
                        <input type="email" placeholder="gamer@nexus.com" 
                               class="w-full pl-11 pr-4 py-3.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all">
                    </div>
                </div>

                <div x-data="{ show: false, strength: 0 }">
                    <label class="block text-xs font-black uppercase tracking-widest text-slate-400 mb-2">Create Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400"><i class="fa-solid fa-lock"></i></span>
                        <input :type="show ? 'text' : 'password'" 
                               @input="strength = $event.target.value.length"
                               placeholder="Min. 8 characters" 
                               class="w-full pl-11 pr-12 py-3.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all">
                        <button type="button" @click="show = !show" class="absolute inset-y-0 right-0 pr-4 flex items-center text-slate-400 hover:text-primary">
                            <i class="fa-solid" :class="show ? 'fa-eye-slash' : 'fa-eye'"></i>
                        </button>
                    </div>
                    <div class="flex gap-1 mt-2">
                        <div class="h-1 flex-1 rounded-full bg-slate-200 dark:bg-slate-800"><div class="h-full bg-red-500 rounded-full transition-all duration-500" :style="`width: ${strength > 0 ? (strength < 6 ? '33%' : '0') : '0'}`"></div></div>
                        <div class="h-1 flex-1 rounded-full bg-slate-200 dark:bg-slate-800"><div class="h-full bg-yellow-500 rounded-full transition-all duration-500" :style="`width: ${strength >= 6 ? (strength < 10 ? '66%' : '100%') : '0'}`"></div></div>
                        <div class="h-1 flex-1 rounded-full bg-slate-200 dark:bg-slate-800"><div class="h-full bg-emerald-500 rounded-full transition-all duration-500" :style="`width: ${strength >= 10 ? '100%' : '0'}`"></div></div>
                    </div>
                </div>

                <div class="flex items-start gap-3 text-sm">
                    <input type="checkbox" class="mt-1 w-4 h-4 rounded border-slate-300 text-primary focus:ring-primary cursor-pointer">
                    <span class="text-slate-500 dark:text-slate-400 leading-tight">
                        I agree to the <a href="#" class="text-primary font-bold hover:underline">Terms of Service</a> and <a href="#" class="text-primary font-bold hover:underline">Privacy Policy</a>.
                    </span>
                </div>

                <button type="submit" class="w-full py-4 bg-primary hover:bg-violet-600 text-white font-black uppercase italic tracking-widest rounded-xl shadow-lg shadow-primary/30 transform active:scale-[0.98] transition-all">
                    Create My Account
                </button>
            </form>

            <div class="mt-8">
                <div class="relative mb-6 text-center">
                    <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-200 dark:border-slate-800"></div></div>
                    <span class="relative bg-white dark:bg-slate-900 px-4 text-xs font-black text-slate-400 uppercase tracking-widest">Or Sign Up With</span>
                </div>
                <div class="grid grid-cols-3 gap-4">
                    <button class="flex justify-center py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl hover:bg-white dark:hover:bg-slate-700 transition-all active:scale-95 shadow-sm"><i class="fa-brands fa-google text-lg"></i></button>
                    <button class="flex justify-center py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl hover:bg-white dark:hover:bg-slate-700 transition-all active:scale-95 shadow-sm"><i class="fa-brands fa-apple text-xl"></i></button>
                    <button class="flex justify-center py-3 bg-slate-50 dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl hover:bg-white dark:hover:bg-slate-700 transition-all active:scale-95 shadow-sm"><i class="fa-brands fa-facebook-f text-lg"></i></button>
                </div>
            </div>

            <p class="mt-8 text-center text-sm text-slate-500 dark:text-slate-400">
                Already have an account? <a href="login.html" class="text-primary font-bold hover:underline">Login here</a>
            </p>
        </div>
    </main>

    <script>
        function authPage() {
            return {
                darkMode: false,
                dir: 'ltr',
                initTheme() {
                    if (localStorage.getItem('dark-mode') === 'true' || (!('dark-mode' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                        this.darkMode = true;
                        document.documentElement.classList.add('dark');
                    }
                },
                toggleDark() {
                    this.darkMode = !this.darkMode;
                    localStorage.setItem('dark-mode', this.darkMode);
                    this.darkMode ? document.documentElement.classList.add('dark') : document.documentElement.classList.remove('dark');
                },
                initDir() {
                    this.dir = localStorage.getItem('site-dir') || 'ltr';
                    document.getElementById('html-tag').dir = this.dir;
                },
                toggleDir() {
                    this.dir = this.dir === 'ltr' ? 'rtl' : 'ltr';
                    localStorage.setItem('site-dir', this.dir);
                    document.getElementById('html-tag').dir = this.dir;
                }
            }
        }
    </script>
</body>
</html>
